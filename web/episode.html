<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HN Radio: Episode</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- No font <link> here on purpose. This repo ships no font files and hosts none, so the
     three families brand.css names all resolve to system-ui for most readers. There used to be
     a Google Fonts stylesheet for Inter at this spot; it was a third-party request on every page
     load and it is the one thing the "no CDN, no external font hosting" rule names outright. -->
<link rel="stylesheet" href="brand.css">
</head>
<body>
<!-- Masthead: brand lockup left, theme toggle right, sticky and in the flow. Same bar on every
     page. See the longer note in index.html for why the toggle stopped being `position: fixed`. -->
<header class="masthead">
  <p class="eyebrow"><span class="dg">deepgram</span> &middot; <a href="/">HN Radio</a></p>
  <div class="masthead-chrome">
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  </div>
</header>
<h1 id="title">Loading&hellip;</h1>
<p class="muted" id="meta"></p>
<!-- Hidden until there is a number to show. A "0 plays" line on a fresh episode is worse than no
     line: it draws the eye to the one fact nobody wants stated. -->
<p class="muted play-count" id="play-count" hidden></p>

<!-- Sticky console: the two controls you reach for while reading, plus the transport. It has to be
     one contiguous block to stick as a unit, which is why the disclaimer and summary sit below it
     rather than between the player and the chapters. -->
<div class="console">
  <div class="console-player">
    <!-- The transport IS the playback visual. It used to be a play button beside a bar canvas
         reading an AnalyserNode; the canvas is gone and the orb reads that same analyser through
         an amplitude envelope instead (brand.css block 5, web/orb.js). One object, one signal.

         The glyph lives in its own span because app.js swaps it between the play and pause
         CHARACTERS, and it used to do that by writing the BUTTON's innerHTML -- which would now
         delete the orb's lava layers along with the old glyph. -->
    <button class="transport orb orb-glyph" id="transport" type="button" aria-label="Play"
            ><span id="transport-mark">&#9654;</span></button>
    <span class="transport-time" id="transport-time">0:00 / 0:00</span>
  </div>
  <div id="chapters"></div>
  <!-- The console's action row held a "Recast this episode" call to action, a hidden play tab
       and a "back to the script" button, all three carrying class="tab" for the panel switcher.
       All of it went with the recast feature on 2026-09-16. The row itself is gone rather than
       left empty: it was `display: flex` with a gap, so an empty one holds open a strip of dead
       space under the chapter dots. -->
</div>

<!-- One panel, so nothing hides or shows it. It kept its id through the recast removal because
     brand.css and the console's layout both reference it, and renaming a live hook to celebrate
     a deletion is how a stylesheet quietly stops matching. -->
<section id="panel-play">
  <audio id="player" preload="metadata"></audio>
  <!-- The cost receipt. Populated by app.js from episode.json's `cost` block and hidden when
       that block is absent, which is why it ships empty rather than with placeholder figures:
       an episode whose cost could not be computed must show nothing, not a zero. The outro of
       every episode now says this number out loud, so this is where a listener checks it. -->
  <section class="cost" id="cost" hidden aria-labelledby="cost-h">
    <p class="cost-h" id="cost-h">What this episode cost to render</p>
    <div class="cost-figures" id="cost-figures"></div>
    <p class="cost-fine" id="cost-fine"></p>
  </section>
  <p class="note">Every word below is read by Deepgram Flux TTS from plain text, with no markup,
  no phonetic hints, and no voice tuning. Voices are arbitrary AI assignments, not depictions of the commenters.</p>
  <div id="notes"></div>
  <div id="script"></div>
</section>


<script src="theme.js"></script>
<!-- Classic script, before app.js, because three callers need it and one of them is a module:
     app.js here, and the inline scripts in index.html and cast.html. It publishes window.HNOrb. -->
<script src="orb.js"></script>
<!-- Classic script, like orb.js and for the same reason: index.html and stats.html need it too
     and neither of them loads a module. It publishes window.HNPlays. -->
<script src="plays.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
