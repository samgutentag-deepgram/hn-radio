  The light/dark toggle is doing real work here rather than being chrome. These cards are dark

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* ===== THEME CHROME - DO NOT EDIT (keep identical across all docs) ===== */
  :root {
    --bg: #fff;
    --text: #1a1a1a;
    --heading: #111;
    --muted: #555;
    --muted2: #444;
    --faint: #666;
    --rule: #ddd;
    --dot: #e2e2e2;
    --code-bg: #f2f2f2;
    --setup-bg: #f6f6f4;
    --setup-border: #e0e0dc;
    --watch-bg: #fbf7ec;
    --watch-border: #b58900;
    --btn-bg: #f0f0ee;
    --btn-border: #ccc;
    --accent: #c9a227;
  }
  html[data-theme="dark"] {
    --bg: #17191d;
    --text: #cfd2d6;
    --heading: #f1f2f4;
    --muted: #9aa0a6;
    --muted2: #b3b8bd;
    --faint: #888e94;
    --rule: #34383e;
    --dot: #2b2f34;
    --code-bg: #262a30;
    --setup-bg: #1e2126;
    --setup-border: #34383e;
    --watch-bg: #241f14;
    --watch-border: #c9a227;
    --btn-bg: #23262b;
    --btn-border: #3a3f45;
  }
  #theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
    z-index: 10;
  }
  #theme-toggle:hover { border-color: var(--faint); }
  /* ===== END THEME CHROME ===== */

  /* ===== BASE DOCUMENT STYLE (Sam's standing conventions) ===== */
  body {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.55;
    color: var(--text);
    max-width: 46rem;
    margin: 2.5rem auto;
    padding: 0 1.5rem;
    background: var(--bg);
    transition: background 0.15s ease, color 0.15s ease;
  }
  h1, h2, h3 {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height: 1.25;
    color: var(--heading);
  }
  h1 { font-size: 1.7rem; margin: 0 0 0.25rem; }
  h2 {
    font-size: 1.2rem;
    margin: 2.2rem 0 0.6rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--rule);
    page-break-after: avoid;
  }
  h3 { font-size: 1.02rem; margin: 1.5rem 0 0.4rem; }
  p, li { color: var(--text); }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); }
  code {
    font-family: 'SF Mono', ui-monospace, Menlo, monospace;
    font-size: 0.85em;
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }
  pre {
    background: var(--code-bg);
    padding: 0.9rem 1.1rem;
    border-radius: 6px;
    overflow-x: auto;
    page-break-inside: avoid;
  }
  pre code { background: none; padding: 0; }
  blockquote {
    border-left: 3px solid var(--watch-border);
    background: var(--watch-bg);
    margin: 0.8rem 0;
    padding: 0.7rem 0.9rem;
    page-break-inside: avoid;
  }
  table { border-collapse: collapse; width: 100%; margin: 0.8rem 0; page-break-inside: avoid; }
  th, td { border: 1px solid var(--rule); padding: 0.45rem 0.7rem; text-align: left; font-size: 0.95rem; }
  th { font-family: system-ui, sans-serif; }
  .meta { margin-top: 2.5rem; color: var(--faint); font-size: 0.85rem; font-family: system-ui, sans-serif; }
  /* ===== END BASE ===== */

  /* ===== PRINT: force clean light, hide the toggle ===== */
  @media print {
    :root { --bg:#fff; --text:#1a1a1a; --heading:#111; --setup-bg:#f6f6f4; --watch-bg:#fbf7ec; --code-bg:#f2f2f2; }
    body { margin: 0; font-size: 12pt; }
    blockquote, pre { background: none; }
    #theme-toggle { display: none; }
  }

  /* ===== Document-specific styles may be ADDED below this line ===== */
__STYLE__
</style>
</head>
<body>

<button id="theme-toggle" type="button" aria-label="Toggle dark mode">Light mode</button>

<!-- ===== CONTENT START ===== -->
__CONTENT__
<!-- ===== CONTENT END ===== -->

<script>
  /* ===== THEME SCRIPT - DO NOT EDIT (keep identical across all docs) ===== */
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var stored = null;
    try { stored = localStorage.getItem('doc-theme'); } catch (e) {}
    var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = stored || (systemDark ? 'dark' : 'light');

    function apply(t) {
      root.setAttribute('data-theme', t);
      btn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
    }
    apply(theme);

    btn.addEventListener('click', function () {
      theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(theme);
      try { localStorage.setItem('doc-theme', theme); } catch (e) {}
    });
  })();
  /* ===== END THEME SCRIPT ===== */
</script>

</body>
</html>
