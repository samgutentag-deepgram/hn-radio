[project]
name = "hn-radio"
version = "3.0.0"
description = "The Hacker News front page, read aloud every morning by Deepgram Flux text to speech."
readme = "README.md"
# Exact minor, not a floor. This must match the Dockerfile's base image (python:3.12-slim) and
# .python-version, or a green local suite proves nothing about production. `>=3.12` would let a
# local venv drift to 3.13 while the container stayed on 3.12, which is the gap this pin closes.
requires-python = "==3.12.*"

# RUNTIME dependencies: what the nightly show and the served app need.
#
# The pipeline itself (hn_radio/) is stdlib-only -- urllib for HN + Flux, wave for stitching -- so
# everything here belongs to the web layer, the writer, or the clock.
dependencies = [
    # Backend: serves the app + one-click recast, and holds the Deepgram key server-side.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # The Claude writer. Lazy-imported in hn_radio/writers.py, which makes it look optional -- it
    # is not. `scripts/daily.py` imports ClaudeWriter at module scope and the 3am cron runs it, so
    # a build that omitted this would take the nightly show off the air and only find out at 3am.
    "anthropic>=0.120",
    # zoneinfo has no bundled database on every platform, and hn_radio/config.py resolves
    # ZoneInfo("America/Los_Angeles") at import time -- so without this, importing config fails
    # outright rather than degrading. The container also apt-installs tzdata for DST-aware cron;
    # this is the same data for Python's benefit, on hosts that lack it.
    "tzdata>=2024.1",
]

[dependency-groups]
# Not installed in the image: `uv sync --no-dev` is what keeps pytest out of production.
dev = [
    "pytest>=8",
    # fastapi's TestClient needs it. It arrives transitively via anthropic today, which means the
    # test suite's ability to run depends on a runtime dependency it has nothing to do with.
    # Declared here so dropping the Claude writer someday breaks one line, not the whole suite.
    "httpx>=0.28",
    # `scripts/make_cover.py` only. The cover it writes is a SHIPPED artifact -- the podcast feed
    # points every player at episodes/cover.png -- but it is regenerated by hand a couple of times
    # a year, so nothing in the running app or the nightly show imports PIL. Undeclared until
    # 2026-08-20, which meant the script failed on any clean venv.
    #
    # In the `dev` group and not a group of its own, deliberately. `uv sync --no-dev` is exactly
    # `--no-group dev`, so `dev` is the ONLY group the image's install is guaranteed to skip: a
    # `cover` group would need `tool.uv.default-groups` to be installed locally, and being in
    # default-groups is what would put it back in the image. One group, one rule, and the
    # "no image bloat" half is the half that has to hold.
    #
    # Floor at 11 because the font fallback in that script calls `ImageFont.load_default(size=...)`,
    # which only takes a size from Pillow 10.1 on.
    "pillow>=11",
]

[tool.pytest.ini_options]
# `uv run pytest` runs the console script, and a console script -- unlike `python -m pytest` -- does
# NOT put the working directory on sys.path. Without this, every `from hn_radio import ...` in the
# suite stops resolving the moment the runner changes. Declared here so the same suite passes under
# `uv run pytest`, `uv run python -m pytest`, and a bare `pytest` in an activated venv.
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# A virtual project: `uv sync` installs the dependencies and does NOT build or install hn_radio
# itself. Both `hn_radio` and `backend` are imported from the working directory -- by `python -m
# hn_radio`, by `uvicorn backend.app:app`, and by the scripts that put the repo root on sys.path --
# exactly as they are in the image, which copies source into /app. Packaging them would add a build
# step and a second copy of the code on sys.path for no gain.
package = false
